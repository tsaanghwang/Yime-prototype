name: Historical release entrypoint (blocked)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  blocked:
    name: Redirect product release work
    runs-on: ubuntu-latest

    steps:
      - name: Reject obsolete release workflow
        run: |
          echo "This repository is detached from Yime product maintenance."
          echo 'Run product build and release work in C:\dev\Yime.'
          exit 2
